plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version "1.1.7"
    id 'java'
    id 'maven-publish'
    id 'jacoco'
}

group 'com.epam.healenium'
version '4.0.0'


repositories {
    mavenCentral()
    mavenLocal()
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.hibernate.orm') {
            details.useVersion('7.3.0.Final')
            details.because('Jackson3JsonFormatMapper + tools.jackson alignment for Spring Boot 4')
        }
        if (details.requested.group == 'org.springframework') {
            details.useVersion('7.0.9')
            details.because('Fix CVE-2026-47884, CVE-2026-47890, CVE-2026-47892')
        }
        if (details.requested.group == 'org.apache.tomcat.embed') {
            details.useVersion('11.0.25')
            details.because('Fix CVE-2026-68525, CVE-2026-65182, CVE-2026-65637, CVE-2026-65905, CVE-2026-55276')
        }
        if (details.requested.group == 'io.netty') {
            details.useVersion('4.2.17.Final')
            details.because('Fix CVE-2026-75595')
        }
        if (details.requested.group == 'tools.jackson.core') {
            details.useVersion('3.1.8')
            details.because('Fix Jackson HIGH CVEs')
        }
        if (details.requested.group == 'org.apache.httpcomponents.core5') {
            details.useVersion('5.4.4')
            details.because('Fix httpcore5 HIGH CVEs')
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.retry:spring-retry:2.0.12'

    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'com.zaxxer:HikariCP:3.3.1'
    implementation 'com.vladmihalcea:hibernate-types-52:2.7.0'
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.yaml:snakeyaml:2.0'
    implementation 'com.google.guava:guava:33.8.0-jre'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.epam.healenium:tree-comparing:0.4.14'
    implementation 'org.seleniumhq.selenium:selenium-java:4.25.0'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    implementation 'org.mapstruct:mapstruct:1.3.1.Final'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.16'
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.5.16'
    implementation("io.netty:netty-codec-http:4.2.17.Final")
    implementation("io.netty:netty-codec-compression:4.2.17.Final")
    implementation("io.netty:netty-handler:4.2.17.Final")
    implementation("io.netty:netty-codec-http3:4.2.17.Final")



    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    implementation group: 'org.apache.commons', name: 'commons-compress', version: '1.26.0'
    implementation 'commons-io:commons-io:2.15.1'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation('org.testcontainers:testcontainers:1.19.3')
    testImplementation 'io.rest-assured:rest-assured:5.3.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    annotationProcessor 'org.hibernate.orm:hibernate-processor'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.3.1.Final'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.3.1.Final'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.9'
}

jacocoTestReport {
    group = "reporting"
    description = "Generate Jacoco coverage reports after running tests."
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

