# Activated together with spring.profiles.active=pro (default) or via profile group devlocal → pro
spring:
  datasource:
    username: ${SPRING_POSTGRES_USER:healenihealenium_appum_app}
    password: ${SPRING_POSTGRES_PASSWORD:healenium_app_password}
  liquibase:
    user: ${SPRING_LIQUIBASE_USER:healenium_user}
    password: ${SPRING_LIQUIBASE_PASSWORD:YDk2nmNs4s9aCP6K}
    change-log: classpath:/db/changelog/changelog-pro.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

healenium:
  ai:
    base-url: ${HEALENIUM_AI_SERVICE:http://host.docker.internal:6565}
    tenant-cache-ttl: PT1H
    tenant-cache-max-size: 10000
    service-key: ${HEALENIUM_AI_SERVICE_KEY:}
  membership:
    cache-ttl: PT5M
    cache-max-size: 10000
