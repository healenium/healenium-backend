# Activated together with spring.profiles.active=pro (default) or via profile group devlocal → pro
spring:
  datasource:
    username: ${SPRING_POSTGRES_USER:healenium_app}
    password: ${SPRING_POSTGRES_PASSWORD:healenium_app_password}
  liquibase:
    user: ${SPRING_LIQUIBASE_USER:healenium_user}
    password: ${SPRING_LIQUIBASE_PASSWORD:YDk2nmNs4s9aCP6K}
    change-log: classpath:/db/changelog/changelog-pro.xml

healenium:
  # Pro always requires M2M (filter registered under profile pro; no enforce toggle).
  m2m:
    api-keys: ${M2M_API_KEYS:}
    internal-token: ${M2M_INTERNAL_TOKEN:}
  tenant:
    cache-ttl: PT10M
    cache-max-size: 10000
  ai:
    # Sync / inference targets — not used for per-request tenant validation
    base-url: ${HEALENIUM_AI_SERVICE:http://localhost:6565}
    service-key: ${HEALENIUM_AI_SERVICE_KEY:}
  membership:
    cache-ttl: PT5M
    cache-max-size: 10000
